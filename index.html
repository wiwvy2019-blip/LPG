<script>
// ... existing code ...

// ค้นหาฟังก์ชัน calculateNetwork ของเดิมและแทนที่ด้วยบล็อกนี้ทั้งหมด
window.calculateNetwork = () => {
  try {
    if (typeof log === 'function') log("CALCULATING WITH WILHELM ENGINE...");
    if (nodes.length === 0) {
        alert("❌ ไม่มีโหนดในระบบให้คำนวณ");
        if (typeof log === 'function') log("READY");
        return;
    }

    const maxIter = 1000;
    const tolerance = 0.001;
    const nodeMap = new Map();

    // 1. กำหนดค่าเริ่มต้นและแปลงหน่วย (m และ m3/s)
    nodes.forEach(n => {
      const elev = parseFloat(n.elevation || 0);
      
      // ถังเก็บน้ำหรือแหล่งน้ำ (Fix Grade Nodes)
      if (n.type === 'Reservoir' || n.type === 'Tank') {
        const wl = parseFloat(n.waterLevel || 0);
        n.head = elev + wl; // Head = Elevation + ระดับน้ำ
        n.isFixed = true;
      } else {
        // Junction หรือโหนดใช้น้ำ
        n.head = elev + 10; // สมมติฐานค่าเริ่มต้น (Initial Guess)
        n.isFixed = false;
      }
      
      // แปลง Demand จาก L/s เป็น m3/s (รองรับทั้งตัวแปร baseDemand และ demand)
      const d = n.baseDemand !== undefined ? n.baseDemand : n.demand;
      n.demandM3s = parseFloat(d || 0) / 1000;
      nodeMap.set(n.id, n);
    });

    // 2. คำนวณความต้านทานท่อ (Resistance) ด้วย Hazen-Williams
    links.forEach(l => {
      const d_m = parseFloat(l.diameter || 150) / 1000; // แปลง mm เป็น m
      const len = parseFloat(l.length || 100);
      const c = parseFloat(l.roughness || 130);
      
      // สูตร: R = 10.67 * L / (C^1.852 * D^4.8704)
      l.R = (10.67 * len) / (Math.pow(c, 1.852) * Math.pow(d_m, 4.8704));
      l.flowM3s = 0;
    });

    // 3. เริ่มการคำนวณแบบวนซ้ำ (Newton-Raphson Solver)
    let iter = 0;
    let maxError = Infinity;

    while (iter < maxIter && maxError > tolerance) {
      maxError = 0;

      // ล้างค่าสมดุลมวลน้ำแต่ละโหนด
      nodes.forEach(n => {
        n.sumQ = -n.demandM3s; // น้ำที่ถูกดึงออก
        n.sumdQdH = 0;         // ผลรวมอนุพันธ์
      });

      // คำนวณ Flow และ Derivative จาก Head ของรอบปัจจุบัน
      links.forEach(l => {
        const n1 = nodeMap.get(l.source);
        const n2 = nodeMap.get(l.target);
        if (!n1 || !n2) return;

        const dH = n1.head - n2.head;
        const absDH = Math.abs(dH);
        let Q, dQdH;

        if (absDH < 1e-6) {
          Q = 0; 
          dQdH = 0;
        } else {
          // Q = (hf/R)^(1/1.852)
          Q = Math.pow(absDH / l.R, 1 / 1.852) * Math.sign(dH);
          // อนุพันธ์ dQ/dH
          dQdH = (1 / 1.852) * (Math.abs(Q) / absDH);
        }

        l.flowM3s = Q;

        // สะสมค่าเข้าโหนด (Continuity Equation)
        if (!n1.isFixed) { n1.sumQ -= Q; n1.sumdQdH += dQdH; }
        if (!n2.isFixed) { n2.sumQ += Q; n2.sumdQdH += dQdH; }
      });

      // ปรับแก้ค่า Head ของโหนดเพื่อลด Error
      let currentIterMaxError = 0;
      nodes.forEach(n => {
        if (!n.isFixed && n.sumdQdH > 0) {
          let deltaH = n.sumQ / n.sumdQdH;
          // Dampening: ป้องกัน Head แกว่งเกินไป (สูงสุด +-10m ต่อรอบ)
          deltaH = Math.max(-10, Math.min(10, deltaH));
          n.head += deltaH;
          currentIterMaxError = Math.max(currentIterMaxError, Math.abs(deltaH));
        }
      });
      maxError = currentIterMaxError;
      iter++;
    }

    // 4. สรุปผล (Post-processing)
    nodes.forEach(n => {
      // ✅ จุดสำคัญ: Pressure = Total Head - Elevation
      n.pressure = n.head - parseFloat(n.elevation || 0); 
    });

    links.forEach(l => {
      const d_m = parseFloat(l.diameter || 150) / 1000;
      const area = (Math.PI * Math.pow(d_m, 2)) / 4;
      
      l.flow = l.flowM3s * 1000; // แปลง Flow กลับเป็น L/s สำหรับโชว์บน UI
      l.velocity = Math.abs(l.flowM3s) / area; // m/s
      
      const h1 = nodeMap.get(l.source).head;
      const h2 = nodeMap.get(l.target).head;
      l.headloss = Math.abs(h1 - h2);
    });

    // 5. ส่งผลลัพธ์กลับไปยัง UI ตัวเดิมของคุณ
    const simStatus = `[Wilhelm Engine] Converged in ${iter} Iterations (Error: ${maxError.toFixed(6)})`;
    if (typeof log === 'function') log("READY");
    
    // อัปเดตกราฟิกและตาราง
    if (typeof saveHistory === 'function') saveHistory();
    if (typeof renderNetwork === 'function') renderNetwork();
    
    if (typeof selectedItem !== 'undefined' && selectedItem && typeof updatePropertiesPanel === 'function') {
      updatePropertiesPanel(selectedItem.type, selectedItem.data);
    }
    
    if (typeof updateResultsPanel === 'function') {
      updateResultsPanel(simStatus);
    }

  } catch (err) {
    console.error(err);
    alert("❌ เกิดข้อผิดพลาดในระบบคำนวณ (Engine Error): " + err.message);
    if (typeof log === 'function') log("READY");
  }
};

// ... existing code ...
</script>
