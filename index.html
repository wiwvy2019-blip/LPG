<script>

// --- เริ่มต้นส่วนของ Henzen Wilhelm's Hydraulic Solver (EPANET Core) ---
function solveHydraulicNetwork(nodes, links) {
    const nodeMap = new Map();
    nodes.forEach(n => nodeMap.set(n.id, n));

    const HW_EXP = 1.852;
    const HW_INV = 1.0 / HW_EXP;

    // 1. คำนวณค่าความต้านทาน (Resistance: R) ของแต่ละท่อ
    links.forEach(link => {
        // หากไม่มีค่าให้ใช้ค่า Default (D=100mm, L=100m, C=130)
        let D = (link.diameter || link.dia || 100) / 1000.0; 
        let L = link.length || 100;
        let C = link.cFactor || link.roughness || 130; 
        link.R = (10.67 * L) / (Math.pow(C, 1.852) * Math.pow(D, 4.87));
    });

    // 2. แยก Junctions ออกจาก Fixed Nodes
    let junctions = nodes.filter(n => n.type !== 'reservoir' && n.type !== 'tank');
    let nJunc = junctions.length;

    let maxElev = Math.max(...nodes.map(n => n.elevation || 0));
    nodes.forEach(n => {
        if (n.type === 'reservoir' || n.type === 'tank') {
            n.h = (n.elevation || 0) + (n.baseHead || n.waterLevel || 0);
        } else {
            n.h = maxElev + 10; 
        }
    });

    let maxIter = 50;
    let tolerance = 0.0001; 
    let converged = false;

    // 3. เริ่มลูป Newton-Raphson Iteration
    for (let iter = 0; iter < maxIter; iter++) {
        let J = Array(nJunc).fill(0).map(() => Array(nJunc).fill(0));
        let F = Array(nJunc).fill(0);

        let jIndex = {};
        junctions.forEach((jnc, i) => {
            jIndex[jnc.id] = i;
            // แปลง Demand จาก L/s เป็น m3/s
            F[i] = -(jnc.demand || 0) / 1000.0; 
        });

        links.forEach(link => {
            let node1 = nodeMap.get(link.source);
            let node2 = nodeMap.get(link.target);
            if (!node1 || !node2) return;

            let dH = node1.h - node2.h; 
            let absDh = Math.abs(dH);
            let Q = 0;
            let dQdH = 0; 

            if (absDh > 0.00001) {
                Q = Math.sign(dH) * Math.pow(absDh / link.R, HW_INV);
                dQdH = HW_INV * Math.pow(absDh / link.R, HW_INV - 1) / link.R;
            } else {
                let R_lin = link.R * Math.pow(0.00001, HW_EXP - 1);
                Q = dH / R_lin;
                dQdH = 1.0 / R_lin;
            }

            link.flow_m3s = Q; 

            let idx1 = jIndex[node1.id];
            let idx2 = jIndex[node2.id];

            if (idx1 !== undefined) {
                F[idx1] -= Q; 
                J[idx1][idx1] += dQdH;
                if (idx2 !== undefined) J[idx1][idx2] -= dQdH;
            }
            if (idx2 !== undefined) {
                F[idx2] += Q; 
                J[idx2][idx2] += dQdH;
                if (idx1 !== undefined) J[idx2][idx1] -= dQdH;
            }
        });

        let maxErr = Math.max(...F.map(Math.abs));
        if (maxErr < tolerance) {
            converged = true;
            break;
        }

        let dH = _solveGaussianLinear(J, F);

        junctions.forEach((jnc, i) => {
            jnc.h += dH[i];
        });
    }

    // 4. สรุปผลลัพธ์ (หัก Elevation ออกเพื่อให้ได้ Pressure จริง)
    nodes.forEach(n => {
        n.head = n.h; 
        n.pressure = n.head - (n.elevation || 0); 
    });

    links.forEach(link => {
        let D = (link.diameter || link.dia || 100) / 1000.0;
        let area = (Math.PI * Math.pow(D, 2)) / 4.0;
        
        link.flow = link.flow_m3s * 1000.0; // แปลงกลับเป็น L/s
        link.velocity = Math.abs(link.flow_m3s) / area; // ความเร็ว m/s
        link.headloss = Math.abs((nodeMap.get(link.source)?.head || 0) - (nodeMap.get(link.target)?.head || 0));
    });

    if (!converged) {
        console.warn("Hydraulic Engine: ระบบสมการไม่ลู่เข้าในจำนวนรอบที่กำหนด (Max Iterations Reached)");
    }

    return { nodes, links, converged };
}

function _solveGaussianLinear(A, b) {
    let n = b.length;
    let mat = A.map((row, i) => [...row, b[i]]); 

    for (let i = 0; i < n; i++) {
        let maxEl = Math.abs(mat[i][i]), maxRow = i;
        for (let k = i + 1; k < n; k++) {
            if (Math.abs(mat[k][i]) > maxEl) {
                maxEl = Math.abs(mat[k][i]);
                maxRow = k;
            }
        }
        let tmp = mat[maxRow];
        mat[maxRow] = mat[i];
        mat[i] = tmp;
        for (let k = i + 1; k < n; k++) {
            let c = -mat[k][i] / mat[i][i];
            for (let j = i; j <= n; j++) {
                if (i === j) mat[k][j] = 0;
                else mat[k][j] += c * mat[i][j];
            }
        }
    }
    let x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
        x[i] = mat[i][n] / mat[i][i];
        for (let k = i - 1; k >= 0; k--) {
            mat[k][n] -= mat[k][i] * x[i];
        }
    }
    return x;
}
// --- สิ้นสุดส่วนของ Henzen Wilhelm's Hydraulic Solver ---
</script>
